# Netlify build & deploy configuration.
# Frontend root is the repo's frontend/ folder; the SPA is served from dist/.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# SPA fallback: every route serves index.html so React Router owns navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Backend proxy ──────────────────────────────────────────────────────────
# Proxies /api requests to the hosted FastAPI backend on Render. The browser
# only ever talks to the Netlify domain, which keeps the HttpOnly refresh
# cookie SAME-SITE — the rotating-refresh login flow breaks without this
# (Lax cookies are not sent on cross-site XHR).
#
# "force = true" + placement BEFORE the SPA fallback is what makes the proxy
# take precedence over the "/* -> /index.html" rewrite.
[[redirects]]
  from = "/api/*"
  to = "https://site--dentalcare-backend--f7yrjsdr2ps8.code.run/:splat"
  status = 200
  force = true

# ── Security headers for the SPA ──────────────────────────────────────────
# The backend already sends its own; these complement the Netlify edge.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
